name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Type check with mypy
        run: |
          uv run --frozen mypy qpfl

      - name: Run tests
        run: |
          uv run --frozen pytest -q --cov=qpfl --cov-branch --cov-report=term --cov-fail-under=80

      - name: Run API coverage gate
        run: |
          uv run --frozen pytest -q tests/test_api.py tests/test_request_util.py tests/test_github_store.py tests/test_nfl_draft_config.py tests/test_commissioner_exports.py --cov=api --cov-branch --cov-report=term --cov-fail-under=55

      - name: Syntax-check web/app.js
        run: node --check web/app.js

      - name: Validate JSON schemas
        run: uv run --frozen python -m qpfl.data_validation

      - name: Check cross-file data integrity
        run: uv run --frozen python scripts/check_integrity.py

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for high-priority TODOs..."
          grep -rn "TODO.*URGENT\|FIXME" qpfl/ || echo "No urgent TODOs found"
        continue-on-error: true
