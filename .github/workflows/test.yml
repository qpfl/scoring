name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Data-only pushes skip the suite (below), so the live-data checks run
  # against main once a day instead of on every lineup and score commit.
  schedule:
    - cron: '40 13 * * *'
  workflow_dispatch:

jobs:
  # Lineup, transaction and score commits from the API and bots touch only
  # data. Running the full matrix on them fails the moment a live-data check
  # catches an in-season change (score.yml already validates data against its
  # own baseline), and it adds nothing for code. This is a job-level skip, not
  # paths-ignore: deploy-pages.yml redeploys when Tests completes successfully,
  # and some API writes (trade blocks, FA pool, avatars) reach the Pages
  # mirror only that way. A skipped job still counts as success.
  scope:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          code_changed=true
          if [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] \
              && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch --quiet --depth=1 origin "$BEFORE" \
              && changed=$(git diff --name-only "$BEFORE" "$AFTER"); then
            printf 'Changed paths:\n%s\n' "$changed"
            code_paths=$(printf '%s\n' "$changed" | grep -v -E \
              '^(data/|web/data/|web/data\.json$|web/images/avatars/)' || true)
            if [ -n "$changed" ] && [ -z "$code_paths" ]; then
              code_changed=false
            fi
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"

  test:
    needs: scope
    if: needs.scope.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Type check with mypy
        run: |
          uv run --frozen mypy qpfl

      - name: Run tests
        run: |
          uv run --frozen pytest -q --cov=qpfl --cov-branch --cov-report=term --cov-fail-under=80

      - name: Run API coverage gate
        run: |
          uv run --frozen pytest -q tests/test_api.py tests/test_request_util.py tests/test_github_store.py tests/test_nfl_draft_config.py tests/test_commissioner_exports.py --cov=api --cov-branch --cov-report=term --cov-fail-under=55

      - name: Syntax-check web/app.js
        run: node --check web/app.js

      - name: Validate JSON schemas
        run: uv run --frozen python -m qpfl.data_validation

      - name: Check cross-file data integrity
        run: uv run --frozen python scripts/check_integrity.py

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for high-priority TODOs..."
          grep -rn "TODO.*URGENT\|FIXME" qpfl/ || echo "No urgent TODOs found"
        continue-on-error: true
