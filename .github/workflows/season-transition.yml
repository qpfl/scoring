name: QPFL Season Transition

on:
  workflow_dispatch:
    inputs:
      new_season:
        description: 'New season year (e.g., 2027)'
        required: true
        type: number
      dry_run:
        description: 'Dry run (show changes without applying)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  transition:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Export Hall of Fame (finalize previous season)
        if: ${{ !inputs.dry_run }}
        run: uv run --frozen python scripts/export_hall_of_fame.py

      - name: Create new season
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --frozen python scripts/create_new_season.py ${{ inputs.new_season }} --dry-run
          else
            uv run --frozen python scripts/create_new_season.py ${{ inputs.new_season }}
          fi

      - name: Export current season data
        if: ${{ !inputs.dry_run }}
        run: uv run --frozen python scripts/export_current.py --season ${{ inputs.new_season }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          git diff --staged --quiet || git commit -m "Season transition: start ${{ inputs.new_season }} season - $(date -u '+%Y-%m-%d %H:%M UTC')"

          scripts/git_push_with_retry.sh origin main 5
