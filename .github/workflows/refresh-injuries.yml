name: Refresh Injury Statuses

on:
  workflow_dispatch:

  schedule:
    # Daily at 12:00 PM ET (16:00 UTC, EDT offset - same convention as score.yml)
    - cron: '0 16 * 1,2,9-12 *'
    # Report days: after Wed-Fri practice reports (6 PM ET), and before Sunday's
    # early games (11 AM ET) when game-day decisions land.
    - cron: '0 22 * 1,2,9-12 3-5'
    - cron: '0 15 * 1,2,9-12 0'

env:
  PYTHON_VERSION: '3.11'
  CURRENT_SEASON: '2026'

# Shared with every other workflow that commits web/data.json or web/data/
# (score.yml, trade_blocks.yml, season-transition.yml) - that file is a
# single minified line, so a concurrent writer produces a rebase conflict
# scripts/git_push_with_retry.sh can't auto-merge, and the whole commit is
# lost. See docs/ROADMAP_2026.md P3.1 / the in-season reliability plan,
# phase 3.2.
concurrency:
  group: qpfl-web-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      # Check out main's tip, not the triggering SHA: a run queued behind
      # another qpfl-web-data writer must start from that writer's commit,
      # or its regenerated web/data files conflict on the push rebase.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Refresh injury statuses from ESPN
        run: uv run --frozen python scripts/refresh_injury_statuses.py --season ${{ env.CURRENT_SEASON }}

      - name: Export refreshed injuries for the website
        run: uv run --frozen python scripts/export_current.py --season ${{ env.CURRENT_SEASON }}

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/injury_statuses.json web/data.json web/data/
          git diff --staged --quiet || git commit -m "Refresh injury statuses - $(date -u '+%Y-%m-%d %H:%M UTC')"
          scripts/git_push_with_retry.sh origin main 5

      # Only one run can wait in the shared concurrency group; a newer one
      # cancels it. If this run replaced a queued score.yml run, that run's
      # scoring would be lost until the next cron, so queue scoring again.
      - name: Queue a scoring run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run score.yml --repo "${GITHUB_REPOSITORY}"
