name: Update Trade Blocks

on:
  push:
    paths:
      - 'data/trade_blocks.json'
    branches:
      - main

permissions:
  contents: write

# Shared with every other workflow that commits web/data.json or web/data/
# (score.yml, refresh-injuries.yml, season-transition.yml) - that file is a
# single minified line, so a concurrent writer produces a rebase conflict
# scripts/git_push_with_retry.sh can't auto-merge, and the whole commit is
# lost. See docs/ROADMAP_2026.md P3.1 / the in-season reliability plan,
# phase 3.2.
concurrency:
  group: qpfl-web-data
  cancel-in-progress: false

jobs:
  update-trade-blocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Update trade blocks in web data
        run: uv run --frozen python scripts/update_trade_blocks.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet web/data.json web/data/seasons/*/live.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/data.json web/data/seasons/*/live.json
          git commit -m "Update trade blocks in web data"
          scripts/git_push_with_retry.sh origin main 5
