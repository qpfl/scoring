name: Update Trade Blocks

on:
  push:
    paths:
      - 'data/trade_blocks.json'
    branches:
      - main

permissions:
  contents: write
  actions: write

# Shared with every other workflow that commits web/data.json or web/data/
# (score.yml, refresh-injuries.yml, season-transition.yml) - that file is a
# single minified line, so a concurrent writer produces a rebase conflict
# scripts/git_push_with_retry.sh can't auto-merge, and the whole commit is
# lost. See docs/ROADMAP_2026.md P3.1 / the in-season reliability plan,
# phase 3.2.
concurrency:
  group: qpfl-web-data
  cancel-in-progress: false

jobs:
  update-trade-blocks:
    runs-on: ubuntu-latest

    steps:
      # Check out main's tip, not the triggering SHA: a run queued behind
      # another qpfl-web-data writer must start from that writer's commit,
      # or its regenerated web/data files conflict on the push rebase.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Update trade blocks in web data
        run: uv run --frozen python scripts/update_trade_blocks.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet web/data.json web/data/seasons/*/live.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/data.json web/data/seasons/*/live.json
          git commit -m "Update trade blocks in web data"
          scripts/git_push_with_retry.sh origin main 5

      # Only one run can wait in the shared concurrency group; a newer one
      # cancels it. If this run replaced a queued score.yml run, that run's
      # scoring would be lost until the next cron, so queue scoring again.
      - name: Queue a scoring run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run score.yml --repo "${GITHUB_REPOSITORY}"
