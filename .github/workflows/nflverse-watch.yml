name: nflverse Watch

# Score when the data actually lands instead of guessing when it will.
#
# The fixed crons in score.yml have to be set to a time the stats are *probably*
# published by. nflverse publishes on its own schedule, so every guess is either
# too early (the 4:25 slate scored as zeros because the feed had not caught up)
# or needlessly late. nflverse offers no webhook or repository_dispatch we can
# subscribe to, so the closest thing to an event is polling the release asset's
# updated_at - which is cheap: three API calls, no stats downloaded.
#
# This does not replace score.yml's crons. They stay as a backstop, because a
# poll is only as reliable as GitHub's best-effort scheduler - the same thing
# that silently dropped a Sunday tick.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Dispatch scoring even if the feed has not moved'
        required: false
        default: false
        type: boolean

  schedule:
    # GitHub does not reliably honor short-interval crons - a 15-minute
    # schedule was observed firing only a handful of times over 22 hours
    # instead of the ~90 expected. Firing at every 15-minute mark all day
    # was also mostly wasted: nflverse only publishes around these six
    # times (mirrored from nflverse-data's own update_data.yaml crons), so
    # trigger right at each one and let the job itself poll every 5 minutes
    # from there - one job run only needs GitHub to deliver a single tick
    # per window, instead of depending on dozens of them.
    - cron: '3 9 * 1,2,9-12 *'    # Daily catch-all
    - cron: '33 5 * 1,2,9-12 5'   # After TNF
    - cron: '3 22 * 1,2,9-12 0'   # After the early window
    - cron: '7 0 * 1,2,9-12 1'    # After the late-afternoon window
    - cron: '33 5 * 1,2,9-12 1'   # After SNF
    - cron: '33 5 * 1,2,9-12 2'   # After MNF

env:
  CURRENT_SEASON: '2026'

# One poll at a time. A backed-up queue of pollers would dispatch the same
# rescore repeatedly.
concurrency:
  group: qpfl-nflverse-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Each cron above lands close to when nflverse starts publishing; the
    # matching score.yml backstop fires ~27-30 minutes later. Poll every 5
    # minutes for up to 35 minutes so this job gets first crack at scoring,
    # with the fixed backstop still catching anything this run misses.
    timeout-minutes: 45
    permissions:
      contents: read
      # Needed to dispatch score.yml. workflow_dispatch is one of the two
      # events GITHUB_TOKEN is allowed to trigger a new run with.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Stdlib only, so no uv sync - the whole point is for this to be cheap.
      - name: Poll until nflverse publishes or the window closes
        id: feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempts=8
          interval=300
          if [ "${{ inputs.force }}" = "true" ]; then
            attempts=1
          fi
          updated=false
          for i in $(seq 1 "$attempts"); do
            output=$(python3 scripts/nflverse_feed_updated.py --season "${CURRENT_SEASON}")
            echo "$output"
            if echo "$output" | grep -q 'rescore needed:.*True'; then
              updated=true
              break
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep "$interval"
            fi
          done
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Trigger scoring
        if: steps.feed.outputs.updated == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run score.yml --repo "${GITHUB_REPOSITORY}"
