name: QPFL Notifications

# Split out of QPFL Autoscorer (score.yml) so lineup/trade/transaction emails
# don't share that workflow's concurrency group. That group allows only one
# queued run at a time, so several pushes landing while a scoring run is in
# progress cancel each other's *pending* run - and a cancelled run's
# notifications were simply never sent, with no error anywhere, because
# scoring self-heals on the next run but notifications do not. Deliberately
# no concurrency group here: each push's diff is against its own HEAD~1, so
# concurrent notify runs are independent and safe, and every push's
# notifications should actually fire rather than be coalesced away. See
# docs/ROADMAP_2026.md P3.1 / the in-season reliability plan, phase 2.5.

on:
  push:
    branches: [main]
    paths:
      - 'data/lineups/**'
      - 'data/pending_trades.json'
      - 'data/transaction_log.json'

env:
  PYTHON_VERSION: '3.11'
  # Set to 'true' to only email GSA (for testing)
  DISABLE_EMAILS: 'false'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Detect and send notifications
        env:
          DISABLE_EMAILS: ${{ env.DISABLE_EMAILS }}
          GSA_EMAIL: ${{ secrets.GSA_EMAIL }}
          CGK_EMAIL: ${{ secrets.CGK_EMAIL }}
          CWR_EMAIL: ${{ secrets.CWR_EMAIL }}
          CWR_COOWNER_EMAIL: ${{ secrets.CWR_COOWNER_EMAIL }}
          AYP_EMAIL: ${{ secrets.AYP_EMAIL }}
          JRW_EMAIL: ${{ secrets.JRW_EMAIL }}
          AST_EMAIL: ${{ secrets.AST_EMAIL }}
          WJK_EMAIL: ${{ secrets.WJK_EMAIL }}
          SLS_EMAIL: ${{ secrets.SLS_EMAIL }}
          RPA_EMAIL: ${{ secrets.RPA_EMAIL }}
          S_T_EMAIL: ${{ secrets.S_T_EMAIL }}
          J_J_EMAIL: ${{ secrets.J_J_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import re

          from scripts.email_delivery import (
              all_recipients,
              eastern_timestamp,
              recipients_for_teams,
              send_email as deliver_email,
          )
          from scripts.lineup_notifications import format_lineup_notification

          delivery_failures = []

          def get_eastern_time():
              return eastern_timestamp()

          TEAM_NAMES = {
              "GSA": "Griff", "CGK": "Kaminska", "CWR": "Reardon", "AYP": "Arnav",
              "JRW": "Joe W.", "WJK": "Bill", "SLS": "Stephen", "RPA": "Ryan",
              "S/T": "Spencer/Tim", "J/J": "Joe/Joe", "AST": "Anagh"
          }

          def get_recipients(team_codes=None):
              """Get email recipients. If team_codes provided, only those teams."""
              return recipients_for_teams(team_codes) if team_codes else all_recipients()

          def send_email(subject, body, recipients):
              if deliver_email(subject, body, recipients):
                  print(f"Sent: {subject} to {len(recipients)} recipients")
              else:
                  delivery_failures.append(subject)

          def format_player(player):
              if isinstance(player, dict):
                  name = player.get('name', 'Unknown')
                  pos = player.get('position', '')
                  team = player.get('nfl_team', '')
                  if pos and team:
                      return f"{pos} {name} ({team})"
                  return name
              return player

          # Get changed files
          changed = os.popen("git diff --name-only HEAD~1 HEAD").read().strip().split('\n')

          # --- LINEUP NOTIFICATIONS ---
          lineup_changes = [f for f in changed if f.startswith('data/lineups/') and f.endswith('.json')]
          if lineup_changes:
              week_num = None
              body = f"QPFL Lineup Update\n{get_eastern_time()}\n\n"

              for filepath in lineup_changes:
                  if not os.path.exists(filepath):
                      continue

                  match = re.search(r'week_(\d+)', filepath)
                  if match:
                      week_num = match.group(1)

                  with open(filepath) as f:
                      data = json.load(f)

                  prev_data = {}
                  try:
                      prev = os.popen(f"git show HEAD~1:{filepath} 2>/dev/null").read()
                      if prev:
                          prev_data = json.loads(prev)
                  except:
                      pass

                  for team_code, lineup in data.get('lineups', {}).items():
                      prev_lineup = prev_data.get('lineups', {}).get(team_code, {})
                      if lineup != prev_lineup:
                          owner = TEAM_NAMES.get(team_code, team_code)
                          body += format_lineup_notification(
                              team_code, owner, week_num, lineup, prev_lineup
                          )

              body += "View lineups: https://qpfl-scoring.vercel.app/\n"
              send_email(f"QPFL Lineups - Week {week_num}", body, get_recipients())

          # --- TRADE NOTIFICATIONS ---
          if 'data/pending_trades.json' in changed:
              with open('data/pending_trades.json') as f:
                  data = json.load(f)

              prev_trades = []
              try:
                  prev = os.popen("git show HEAD~1:data/pending_trades.json 2>/dev/null").read()
                  if prev:
                      prev_trades = json.loads(prev).get('trades', [])
              except:
                  pass

              # Build lookup of previous trade states
              prev_trade_status = {t.get('id'): t.get('status') for t in prev_trades}
              prev_ids = set(prev_trade_status.keys())

              current_trades = data.get('trades', [])

              # Find new trades (new IDs) and status-changed trades (e.g., pending -> accepted)
              trades_to_notify = []
              for trade in current_trades:
                  trade_id = trade.get('id')
                  if trade_id not in prev_ids:
                      # New trade proposal
                      trades_to_notify.append(('new', trade))
                  elif prev_trade_status.get(trade_id) == 'pending' and trade.get('status') in ('accepted', 'rejected'):
                      # Status changed from pending
                      trades_to_notify.append(('status_changed', trade))

              for notify_type, trade in trades_to_notify:
                  proposer = trade.get('proposer', 'Unknown')
                  partner = trade.get('partner', 'Unknown')
                  proposer_gives = trade.get('proposer_gives', {})
                  proposer_receives = trade.get('proposer_receives', {})
                  status = trade.get('status', '').lower()
                  conditions = trade.get('conditions', {})
                  comment = trade.get('comment', '')

                  # Helper to format item with condition
                  def format_with_condition(item, item_type, direction):
                      item_str = format_player(item) if isinstance(item, dict) else item
                      cond_key = f"{item_type}-{direction}-{item if isinstance(item, str) else item.get('name', item)}"
                      cond = conditions.get(cond_key)
                      if cond:
                          return f"{item_str} [Condition: {cond}]"
                      return item_str

                  body = ""
                  if status == 'accepted':
                      body += f"==============================\nTRADE COMPLETED\n{get_eastern_time()}\n==============================\n\n"
                      recipients = get_recipients()
                      subject = "QPFL Trade Completed"
                  elif status == 'rejected':
                      body += f"==============================\nTRADE REJECTED\n{get_eastern_time()}\n==============================\n\n"
                      recipients = get_recipients([proposer])
                      subject = f"QPFL Trade Rejected by {TEAM_NAMES.get(partner, partner)}"
                  else:
                      body += f"==============================\nTRADE PROPOSAL\n{get_eastern_time()}\n==============================\n\n"
                      recipients = get_recipients([proposer, partner])
                      subject = f"QPFL Trade Proposal from {TEAM_NAMES.get(proposer, proposer)}"

                  body += f"{TEAM_NAMES.get(proposer, proposer)} ({proposer}) sends:\n"
                  for p in proposer_gives.get('players', []):
                      body += f"  - {format_with_condition(p, 'player', 'give')}\n"
                  for pick in proposer_gives.get('picks', []):
                      body += f"  - {format_with_condition(pick, 'pick', 'give')}\n"

                  body += f"\n{TEAM_NAMES.get(partner, partner)} ({partner}) sends:\n"
                  for p in proposer_receives.get('players', []):
                      body += f"  - {format_with_condition(p, 'player', 'receive')}\n"
                  for pick in proposer_receives.get('picks', []):
                      body += f"  - {format_with_condition(pick, 'pick', 'receive')}\n"

                  if comment:
                      body += f"\nMessage from {TEAM_NAMES.get(proposer, proposer)}:\n\"{comment}\"\n"

                  body += "\nView: https://qpfl-scoring.vercel.app/#transactions\n"

                  send_email(subject, body, recipients)

          # --- TRANSACTION NOTIFICATIONS ---
          if 'data/transaction_log.json' in changed:
              with open('data/transaction_log.json') as f:
                  data = json.load(f)

              prev_txns = []
              try:
                  prev = os.popen("git show HEAD~1:data/transaction_log.json 2>/dev/null").read()
                  if prev:
                      prev_txns = json.loads(prev).get('transactions', [])
              except:
                  pass

              # Transactions are sorted newest-first, so new ones are at the beginning
              current_txns = data.get('transactions', [])
              num_new = len(current_txns) - len(prev_txns)
              new_txns = current_txns[:num_new] if num_new > 0 else []

              # Filter out trades (they have their own notification above)
              roster_txns = [t for t in new_txns if t.get('type') != 'trade']

              if roster_txns:
                  body = f"QPFL Roster Transaction\n{get_eastern_time()}\n\n"
                  week = None

                  for txn in roster_txns:
                      team_code = txn.get('team', 'Unknown')
                      team_name = TEAM_NAMES.get(team_code, team_code)
                      txn_type = txn.get('type', 'transaction').replace('_', ' ').title()
                      added = txn.get('added') or txn.get('activated', '')
                      released = txn.get('released', '')
                      week = txn.get('week', week)

                      body += f"------------------------------\n"
                      body += f"{txn_type} - {team_name} ({team_code})\n"
                      body += f"------------------------------\n"
                      if added:
                          body += f"  + ADDED: {format_player(added)}\n"
                      if released:
                          body += f"  - RELEASED: {format_player(released)}\n"
                      body += "\n"

                  body += "View: https://qpfl-scoring.vercel.app/#transactions\n"
                  send_email(f"QPFL Roster Move - Week {week}", body, get_recipients())

          if delivery_failures:
              raise SystemExit(f"Failed email deliveries: {', '.join(delivery_failures)}")
          print("Notification processing complete")
          EOF
