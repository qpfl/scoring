name: QPFL Update Player Teams

on:
  # Monthly on the 1st during the offseason (February–August)
  schedule:
    - cron: '0 12 1 2-8 *'

  # Manual trigger (also useful for one-off updates mid-season)
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year to query (default: current calendar year)'
        required: false
        type: number
      dry_run:
        description: 'Dry run — show changes without saving'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Update player team assignments
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="--season ${{ inputs.season }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run --frozen python scripts/update_player_teams.py $ARGS

      - name: Commit and push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/rosters.json

          if git diff --staged --quiet; then
            echo "No team changes — nothing to commit"
          else
            git commit -m "Update player team assignments - $(date -u '+%Y-%m-%d')"
            scripts/git_push_with_retry.sh origin main 5
          fi
