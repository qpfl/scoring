name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:
  # Bot commits pushed with GITHUB_TOKEN do not fire `push`, so the workflows
  # that regenerate web/ data would otherwise never redeploy the site.
  workflow_run:
    workflows:
      - QPFL Autoscorer
      - Update Trade Blocks
      - Expire Stale Trades
      - QPFL Update Player Teams
      - QPFL Season Transition
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed content
        uses: actions/checkout@v4
        with:
          # workflow_run reports the SHA that started the upstream run, which
          # predates any data commit that run pushed. Always take main's head.
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
